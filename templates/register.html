<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#F5F1E6">
  <title>{{.Title}} — Immerse</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip" href="#main">Lompat ke konten</a>
  <header class="nav"><div class="wrap nav__in">
    <a class="brand" href="/" aria-label="Immerse beranda"><img src="/assets/logo.svg" alt="" width="150" height="50"></a>
    <a class="btn btn--ghost" href="/">Beranda</a>
  </div></header>
  <main id="main" class="auth"><div class="wrap auth__grid">
    <aside class="auth__panel" aria-hidden="true">
      <img src="/assets/mascot.svg" alt="" width="220" height="165">
      <p>Buat akun dan mulai menempel link video favoritmu.</p>
      <ul class="auth__points">
        <li>3 video pertama gratis</li>
        <li>Tanpa kartu kredit</li>
        <li>Langsung bisa belajar</li>
      </ul>
    </aside>
    <section class="auth__card">
      <h1>Daftar</h1>
      {{if .Error}}<p class="auth__error" role="alert" tabindex="-1" autofocus id="form-error-live">{{.Error}}</p>{{end}}
      <form method="post" action="/register" class="auth__form" autocomplete="on">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" autocapitalize="none" enterkeyhint="next" required value="{{.Email}}"{{if .Error}} aria-invalid="true" aria-describedby="form-error-live"{{end}}>
        <label for="phone">Nomor HP</label>
        <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" enterkeyhint="next" placeholder="08123456789" required value="{{.Phone}}"{{if .Error}} aria-invalid="true" aria-describedby="form-error-live"{{end}}>
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" enterkeyhint="next" placeholder="alya_dev" required minlength="3" maxlength="20" pattern="[a-z0-9_]{3,20}" aria-describedby="{{if .Error}}form-error-live {{end}}username-hint"{{if .Error}} aria-invalid="true"{{end}} value="{{.Username}}">
        <p class="auth__hint" id="username-hint">3–20 karakter: huruf kecil, angka, garis bawah.</p>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="new-password" enterkeyhint="next" required minlength="8" maxlength="72" aria-describedby="{{if .Error}}form-error-live {{end}}password-hint"{{if .Error}} aria-invalid="true"{{end}}>
        <p class="auth__hint" id="password-hint">Minimal 8 karakter.</p>
        <label for="password_confirm">Konfirmasi password</label>
        <input id="password_confirm" name="confirm" type="password" autocomplete="new-password" enterkeyhint="done" required minlength="8" maxlength="72"{{if .Error}} aria-invalid="true" aria-describedby="form-error-live"{{end}}>
        <button class="btn btn--primary" type="submit">Daftar</button>
      </form>
      <p class="auth__alt">Sudah punya akun? <a href="/login">Masuk</a></p>
    </section>
  </div></main>
</body>
</html>
