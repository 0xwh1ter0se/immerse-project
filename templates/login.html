<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#F5F1E6">
  <title>{{.Title}} — Immerse</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip" href="#main">Lompat ke konten</a>
  <header class="nav"><div class="wrap nav__in">
    <a class="brand" href="/" aria-label="Immerse beranda"><img src="/assets/logo.svg" alt="" width="150" height="50"></a>
    <a class="btn btn--ghost" href="/">Beranda</a>
  </div></header>
  <main id="main" class="auth"><div class="wrap auth__grid">
    <aside class="auth__panel" aria-hidden="true">
      <img src="/assets/mascot.svg" alt="" width="220" height="165">
      <p>Subtitle ganda, grammar, dan Mersi — semuanya menunggu di dalam.</p>
      <ul class="auth__points">
        <li>Subtitle dua bahasa</li>
        <li>Grammar per kalimat</li>
        <li>Tanya Mersi kapan saja</li>
      </ul>
    </aside>
    <section class="auth__card">
      <h1>Masuk</h1>
      {{if .Error}}<p class="auth__error" role="alert" tabindex="-1" autofocus id="form-error-live">{{.Error}}</p>{{end}}
      <form method="post" action="/login" class="auth__form" autocomplete="on">
        <label for="identifier">Email, no HP, atau username</label>
        <input id="identifier" name="identifier" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" enterkeyhint="next" required value="{{.Email}}"{{if .Error}} aria-invalid="true" aria-describedby="form-error-live"{{end}}>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" enterkeyhint="go" required minlength="8" maxlength="72"{{if .Error}} aria-invalid="true" aria-describedby="form-error-live"{{end}}>
        <button class="btn btn--primary" type="submit">Masuk</button>
      </form>
      <p class="auth__alt">Belum punya akun? <a href="/register">Daftar</a></p>
    </section>
  </div></main>
</body>
</html>
